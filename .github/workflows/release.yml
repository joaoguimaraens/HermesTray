name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build
        id: build
        with:
          tag: ${{ github.ref_name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload
        with:
          name: windows-x64
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: package
          merge-multiple: true
      - name: Publish and verify release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          $files = @(Get-ChildItem -LiteralPath package -Filter '*.zip' -File)
          if ($files.Count -ne 1) { throw 'Expected one release ZIP.' }
          $path = $files[0].FullName
          $name = $files[0].Name
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:EXPECTED_SHA256) { throw 'Build artifact checksum mismatch.' }
          $prerelease = $env:GITHUB_REF_NAME.Contains('-')
          $notes = "SHA-256 ($name): $hash"
          $releaseArgs = @(
            'release', 'create', $env:GITHUB_REF_NAME, $path,
            '--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--generate-notes',
            '--notes', $notes, '--title', "HermesTray $env:GITHUB_REF_NAME", '--draft=false',
            "--prerelease=$($prerelease.ToString().ToLowerInvariant())"
          )
          if ($prerelease) { $releaseArgs += '--latest=false' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; existing releases are not overwritten.' }
          $release = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,assets,body | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the published release.' }
          $assets = @($release.assets)
          if ($release.tagName -ne $env:GITHUB_REF_NAME -or $release.isDraft -or $release.isPrerelease -ne $prerelease -or $assets.Count -ne 1 -or $assets[0].name -ne $name -or -not $release.body.Contains($hash)) { throw 'Published release verification failed.' }
          $verify = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString('N'))
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern $name --dir $verify
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath (Join-Path $verify $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'Published asset checksum mismatch.' }

